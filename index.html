  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _origFetch;

          var fetchDescriptor = {
            get: function() {
              return _currentFetch || (window._fallbackFetch ? window._fallbackFetch : function() {
                return Promise.reject(new Error('Fetch unavailable'));
              });
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', fetchDescriptor);
          } catch (e) {
            try {
              window.fetch = _origFetch;
            } catch (inner) {}
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
            } catch (e) {}
          }
        } catch (err) {}

        // Prevent extension interceptor crashes from halting app rendering
        window.addEventListener('error', function(event) {
          if (event && event.message && (
            event.message.indexOf('Cannot set property fetch') !== -1 ||
            event.message.indexOf('requests.js') !== -1 ||
            event.message.indexOf('executors') !== -1 ||
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1)
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason && event.reason.message && (
            event.reason.message.indexOf('Cannot set property fetch') !== -1 ||
            (typeof event.reason.stack === 'string' && event.reason.stack.indexOf('chrome-extension://') !== -1)
          )) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>DriveMate — Designated Driver Booking</title>
